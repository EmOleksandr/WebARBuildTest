<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity WebGL Player | WebXRExport_PluginTest Transparent</title>
  <meta name="description" content="">
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      width: 100%;
      height: 100%;
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      background: transparent;
      pointer-events: auto;
    }
    #unity-container {
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
<div id="unity-container">
  <div id="unity-canvas-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>
  <div id="unity-loading-bar">
    <div id="unity-logo"></div>
    <div id="unity-progress-bar-empty">
      <div id="unity-progress-bar-full"></div>
    </div>
  </div>
  <div id="unity-footer">
    <button id="entervr" value="Enter VR" disabled>VR</button>
    <button id="enterar" value="Enter AR" disabled>AR</button>
    <div id="unity-fullscreen-button">Fullscreen</div>
  </div>
</div>

<script>
  
  var buildUrl = "Build";
  var loaderUrl = buildUrl + "/Build_003.loader.js";
  var config = {
    dataUrl: buildUrl + "/Build_003.data",
    frameworkUrl: buildUrl + "/Build_003.framework.js",
    codeUrl: buildUrl + "/Build_003.wasm",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "DefaultCompany",
    productName: "WebXRExport_PluginTest",
    productVersion: "0.1",
    webglContextAttributes: { alpha: true },  // Enable transparency
  };

  var container = document.querySelector("#unity-container");
  var canvas = document.querySelector("#unity-canvas");
  var loadingBar = document.querySelector("#unity-loading-bar");
  var progressBarFull = document.querySelector("#unity-progress-bar-full");
  var fullscreenButton = document.querySelector("#unity-fullscreen-button");
  var unityInstance = null;
  
  if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
    // Mobile device style: fill the whole browser client area with the game canvas:

    var meta = document.createElement('meta');
    meta.name = 'viewport';
    meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
    document.getElementsByTagName('head')[0].appendChild(meta);
    container.className = "unity-mobile";
    canvas.className = "unity-mobile";

    // To lower canvas resolution on mobile devices to gain some
    // performance, uncomment the following line:
    // config.devicePixelRatio = 1;


  } else {
    // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:

    canvas.style.width = "1080px";
    canvas.style.height = "1920px";
  }
  
  loadingBar.style.display = "block";

  var script = document.createElement("script");
  script.src = loaderUrl;
  script.onload = () => {
    createUnityInstance(canvas, config, (progress) => {
      progressBarFull.style.width = 100 * progress + "%";
    }).then((instance) => {
      unityInstance = instance;
      loadingBar.style.display = "none";
      fullscreenButton.onclick = () => {
        unityInstance.SetFullscreen(1);
      };
    }).catch((message) => {
      alert(message);
    });
  };
  document.body.appendChild(script);

  let enterARButton = document.getElementById('enterar');
  let enterVRButton = document.getElementById('entervr');

  document.addEventListener('onARSupportedCheck', function (event) {
    enterARButton.disabled = !event.detail.supported;
  });
  document.addEventListener('onVRSupportedCheck', function (event) {
    enterVRButton.disabled = !event.detail.supported;
  });

  enterARButton.addEventListener('click', function () {
    unityInstance.Module.WebXR.toggleAR();
  });
  enterVRButton.addEventListener('click', function () {
    unityInstance.Module.WebXR.toggleVR();
  });
</script>
</body>
</html>
