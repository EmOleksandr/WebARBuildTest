<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Unity WebGL Player | WebXRExport_PluginTest</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico" />
  <link rel="stylesheet" href="TemplateData/style.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #unity-container {
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
<div id="unity-container">
  <canvas id="unity-canvas"></canvas>

  <div id="unity-loading-bar">
    <div id="unity-logo"></div>
    <div id="unity-progress-bar-empty">
      <div id="unity-progress-bar-full"></div>
    </div>
  </div>

  <div id="unity-footer">
    <div id="unity-webgl-logo"></div>
    <button id="entervr" disabled>VR</button>
    <button id="enterar" disabled>AR</button>
    <div id="unity-webxr-link">Using <a href="https://github.com/De-Panther/unity-webxr-export" target="_blank">WebXR Export</a></div>
    <div id="unity-build-title">WebXRExport_PluginTest</div>
  </div>
</div>

<script>
  const buildUrl = "Build";
  const loaderUrl = buildUrl + "/Build_004.loader.js";
  const config = {
    dataUrl: buildUrl + "/Build_004.data",
    frameworkUrl: buildUrl + "/Build_004.framework.js",
    codeUrl: buildUrl + "/Build_004.wasm",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "DefaultCompany",
    productName: "WebXRExport_PluginTest",
    productVersion: "0.1"
  };

  const canvas = document.querySelector("#unity-canvas");
  const loadingBar = document.querySelector("#unity-loading-bar");
  const progressBarFull = document.querySelector("#unity-progress-bar-full");
  const enterARButton = document.getElementById('enterar');
  const enterVRButton = document.getElementById('entervr');

  let unityInstance = null;

  function resizeCanvas() {
    canvas.width = window.innerWidth * window.devicePixelRatio;
    canvas.height = window.innerHeight * window.devicePixelRatio;
  }

  // Resize initially and on window resize
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  loadingBar.style.display = "block";

  const script = document.createElement("script");
  script.src = loaderUrl;
  script.onload = () => {
    createUnityInstance(canvas, config, (progress) => {
      progressBarFull.style.width = 100 * progress + "%";
    }).then((instance) => {
      unityInstance = instance;
      loadingBar.style.display = "none";
    }).catch((message) => {
      alert(message);
    });
  };
  document.body.appendChild(script);

  document.addEventListener('onARSupportedCheck', (e) => {
    enterARButton.disabled = !e.detail.supported;
  });
  document.addEventListener('onVRSupportedCheck', (e) => {
    enterVRButton.disabled = !e.detail.supported;
  });

  enterARButton.addEventListener('click', () => {
    unityInstance?.Module?.WebXR?.toggleAR();
  });
  enterVRButton.addEventListener('click', () => {
    unityInstance?.Module?.WebXR?.toggleVR();
  });
</script>
</body>
</html>
