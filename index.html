<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity WebGL Player | WebXRExport_PluginTest Transparent</title>
  <meta name="description" content="">
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      width: 100%;
      height: 100%;
    }
    #unity-canvas {
      background: transparent;
      pointer-events: auto;
      display: block;
    }
    #unity-container {
      position: fixed;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
<div id="unity-container">
  <canvas id="unity-canvas" tabindex="-1"></canvas>

  <div id="unity-loading-bar">
    <div id="unity-logo"></div>
    <div id="unity-progress-bar-empty">
      <div id="unity-progress-bar-full"></div>
    </div>
  </div>

  <div id="unity-footer">
    <button id="entervr" value="Enter VR" disabled>VR</button>
    <button id="enterar" value="Enter AR" disabled>AR</button>
    <div id="unity-fullscreen-button">Fullscreen</div>
  </div>
</div>

<script>
  var buildUrl = "Build";
  var loaderUrl = buildUrl + "/Build_Clean.loader.js";
  var config = {
    dataUrl: buildUrl + "/Build_Clean.data",
    frameworkUrl: buildUrl + "/Build_Clean.framework.js",
    codeUrl: buildUrl + "/Build_Clean.wasm",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "DefaultCompany",
    productName: "WebXRExport_PluginTest",
    productVersion: "0.1",
    webglContextAttributes: { alpha: true },
    matchWebGLToCanvasSize: false  // Disable Unity auto-resize
  };

  var canvas = document.querySelector("#unity-canvas");
  var loadingBar = document.querySelector("#unity-loading-bar");
  var progressBarFull = document.querySelector("#unity-progress-bar-full");
  var fullscreenButton = document.querySelector("#unity-fullscreen-button");
  var unityInstance = null;

  function resizeCanvas(width, height) {
    var dpr = window.devicePixelRatio || 1;
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";
    canvas.width = width * dpr;
    canvas.height = height * dpr;
  }

  function resizeToWindow() {
    resizeCanvas(window.innerWidth, window.innerHeight);
  }

  // Mobile or desktop behavior
  if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
    document.querySelector("#unity-container").className = "unity-mobile";
    canvas.className = "unity-mobile";
    resizeToWindow();
    window.addEventListener('resize', resizeToWindow);
  } else {
    resizeCanvas(1080, 1920);
  }

  loadingBar.style.display = "block";

  var script = document.createElement("script");
  script.src = loaderUrl;
  script.onload = () => {
    createUnityInstance(canvas, config, (progress) => {
      progressBarFull.style.width = 100 * progress + "%";
    }).then((instance) => {
      unityInstance = instance;
      loadingBar.style.display = "none";
      fullscreenButton.onclick = () => {
        unityInstance.SetFullscreen(1);
      };
    }).catch((message) => {
      alert(message);
    });
  };
  document.body.appendChild(script);

  let enterARButton = document.getElementById('enterar');
  let enterVRButton = document.getElementById('entervr');

  document.addEventListener('onARSupportedCheck', function (event) {
    enterARButton.disabled = !event.detail.supported;
  });
  document.addEventListener('onVRSupportedCheck', function (event) {
    enterVRButton.disabled = !event.detail.supported;
  });

  enterARButton.addEventListener('click', function () {
    unityInstance.Module.WebXR.toggleAR();
  });
  enterVRButton.addEventListener('click', function () {
    unityInstance.Module.WebXR.toggleVR();
  });
</script>
</body>
</html>
